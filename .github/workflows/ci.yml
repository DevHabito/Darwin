name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Check maintained repository surface
        run: python scripts/check_maintained_surface.py

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
